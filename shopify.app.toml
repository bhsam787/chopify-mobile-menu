# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "01c6f4382b86d4e4ac9d63f402d506ae"
application_url = "https://example.com"
embedded = true
name = "Chopi - Menu"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: collections/products for widgets and links
# read_content, read_legal_policies: pages, blogs, articles and policies in the link picker
# write_online_store_navigation: the hidden links menu the theme reads for current URLs
# read_themes: theme detection (burger adapters) and app embed status
# write_files: images picked or uploaded in the editor
# read_locales: languages for menu translations
# read_reports: the store's top searches for live search (ShopifyQL search_queries).
scopes = "read_products,read_content,read_legal_policies,read_themes,write_files,read_locales,read_reports"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
